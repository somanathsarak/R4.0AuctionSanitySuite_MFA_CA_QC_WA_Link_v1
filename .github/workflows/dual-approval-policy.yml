name: Dual Approval Policy Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read
  contents: read

jobs:
  check-dual-approval:
    runs-on: ubuntu-latest
    name: Verify Dual Approval Policy
    
    steps:
      - name: Check for dual approval
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = context.payload.pull_request?.number || context.payload.pull_request_review?.pull_request?.number;
            
            if (!pr_number) {
              console.log('Not a pull request event, skipping...');
              return;
            }
            
            // Get all reviews for the PR
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_request_number: pr_number
            });
            
            // Filter approved reviews
            const approvedReviews = reviews.filter(review => review.state === 'APPROVED');
            
            // Get unique approvers
            const uniqueApprovers = [...new Set(approvedReviews.map(review => review.user.login))];
            
            console.log(`Total approved reviews: ${approvedReviews.length}`);
            console.log(`Unique approvers: ${uniqueApprovers.join(', ')}`);
            
            // Check if we have at least 2 approvals
            const requiredApprovals = 2;
            
            if (uniqueApprovers.length < requiredApprovals) {
              core.setFailed(`❌ Dual approval policy requires ${requiredApprovals} approvals. Current: ${uniqueApprovers.length}`);
              core.summary
                .addHeading('🔒 Dual Approval Policy')
                .addRaw(`This PR requires ${requiredApprovals} approvals before merging.`)
                .addList([
                  `Current approvals: ${uniqueApprovers.length}`,
                  `Required approvals: ${requiredApprovals}`,
                  `Approved by: ${uniqueApprovers.join(', ') || 'None'}`
                ])
                .write();
            } else {
              console.log(`✅ Dual approval policy satisfied with ${uniqueApprovers.length} approvals`);
              core.summary
                .addHeading('✅ Dual Approval Policy Satisfied')
                .addRaw(`This PR has the required ${requiredApprovals} approvals.`)
                .addList([
                  `Current approvals: ${uniqueApprovers.length}`,
                  `Approved by: ${uniqueApprovers.join(', ')}`
                ])
                .write();
            }

